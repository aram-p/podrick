name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -czf pd-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release pd
      - uses: softprops/action-gh-release@v2
        with:
          files: pd-${{ matrix.target }}.tar.gz

  # The tap is a separate repository, so this cannot use GITHUB_TOKEN — that one is scoped
  # to this repo. TAP_TOKEN is a fine-grained PAT with contents:write on homebrew-tap and
  # nothing else. Absent, the job warns and skips, same as crates.io below.
  tap:
    needs: binaries
    if: ${{ github.repository == 'aram-p/podrick' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the Homebrew tap
        env:
          TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::TAP_TOKEN is not set — skipping the Homebrew tap update."
            echo "Set it with: gh secret set TAP_TOKEN --repo aram-p/podrick"
            exit 0
          fi
          # Generated before the clone, so a failure to read the published checksums
          # leaves the tap untouched rather than half-updated.
          ./scripts/formula.sh "$TAG" > podrick.rb
          git clone --depth 1 \
            "https://x-access-token:$TOKEN@github.com/aram-p/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp podrick.rb tap/Formula/podrick.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/podrick.rb
          if git diff --cached --quiet; then
            echo "The tap already describes $TAG."
            exit 0
          fi
          git commit -m "podrick $TAG"
          git push

  # Skipped rather than failed when no token is configured: the binaries above are the
  # release, and a missing crates.io token should not turn a good tag red.
  crates-io:
    needs: binaries
    if: ${{ github.repository == 'aram-p/podrick' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set — skipping crates.io publish."
            echo "Set it with: gh secret set CARGO_REGISTRY_TOKEN"
            exit 0
          fi
          cargo publish --locked --token "$TOKEN"
