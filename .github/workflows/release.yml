name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -czf pd-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release pd
      - uses: softprops/action-gh-release@v2
        with:
          files: pd-${{ matrix.target }}.tar.gz

  # Skipped rather than failed when no token is configured: the binaries above are the
  # release, and a missing crates.io token should not turn a good tag red.
  crates-io:
    needs: binaries
    if: ${{ github.repository == 'aram-p/podrick' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set — skipping crates.io publish."
            echo "Set it with: gh secret set CARGO_REGISTRY_TOKEN"
            exit 0
          fi
          cargo publish --locked --token "$TOKEN"
