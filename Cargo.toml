[package]
name = "podrick"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A terminal task tracker with a perfect memory, built for agents first"
license = "MIT"
repository = "https://github.com/aram-p/podrick"
readme = "README.md"
keywords = ["cli", "todo", "tasks", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "pd"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
dirs = "5"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
